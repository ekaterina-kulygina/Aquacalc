<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AquaCalc — Калькулятор</title>
<style>
@font-face{font-family:'Nobile';src:url('fonts/Nobile-Regular.ttf') format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'Nobile';src:url('fonts/Nobile-Medium.ttf') format('truetype');font-weight:500;font-style:normal}
@font-face{font-family:'Nobile';src:url('fonts/Nobile-Bold.ttf') format('truetype');font-weight:700;font-style:normal}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F5F7FA;min-height:100vh;color:#0F172A}

nav{background:#fff;border-bottom:1px solid #DDE5F0;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.nav-inner{max-width:720px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-logo{font-family:'Nobile',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#28B0D8,#1A8FB2);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(40,176,216,.35)}
.nav-pill{font-size:11px;font-weight:600;color:#1A7A96;background:#E0F6FC;padding:3px 10px;border-radius:100px;border:1px solid #A8E8F8}
.nav-back{font-size:13px;color:#64748B;text-decoration:none;transition:color .15s}
.nav-back:hover{color:#28B0D8}

.page{max-width:560px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:14px}

.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}
.card-hdr{padding:14px 18px;border-bottom:1px solid #DDE5F0;display:flex;align-items:center;gap:10px}
.badge{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#28B0D8,#1A8FB2);color:#fff;font-size:12px;font-weight:700;font-family:'Nobile',sans-serif;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(40,176,216,.4)}
.sec-title{font-family:'Nobile',sans-serif;font-size:12px;font-weight:700;color:#64748B;letter-spacing:.08em;text-transform:uppercase}
.card-body{padding:18px}

.field{display:flex;flex-direction:column;gap:6px}
.flbl{font-size:13px;color:#64748B;font-weight:500}
.finput{padding:11px 14px;font-size:15px;font-weight:500;border:1.5px solid #DDE5F0;border-radius:10px;background:#fff;color:#0F172A;font-family:'Inter',sans-serif;outline:none;transition:all .15s;width:100%}
.finput:focus{border-color:#28B0D8;box-shadow:0 0 0 3px rgba(40,176,216,.12)}
.finput.filled{background:#E0F6FC;border-color:#A8E8F8}
.funit{font-size:11px;color:#94A3B8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Dropdown */
.dd-wrap{position:relative}
.dd-trigger{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1.5px solid #DDE5F0;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;color:#64748B;transition:all .15s;width:100%;font-family:'Inter',sans-serif}
.dd-trigger:hover{border-color:#28B0D8;color:#28B0D8}
.dd-trigger.open{border-color:#28B0D8;color:#0F172A;box-shadow:0 0 0 3px rgba(40,176,216,.12)}
.dd-chev{transition:transform .2s;color:#94A3B8}
.dd-trigger.open .dd-chev{transform:rotate(180deg);color:#28B0D8}
.dd-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #DDE5F0;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);max-height:320px;overflow-y:auto;z-index:50}
.dd-group-label{font-family:'Nobile',sans-serif;font-size:10px;font-weight:700;color:#94A3B8;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px 4px;background:#F7F9FC;position:sticky;top:0}
.dd-opt{padding:10px 14px;font-size:14px;color:#0F172A;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .12s}
.dd-opt:hover{background:#E0F6FC}
.dd-opt.used{color:#94A3B8;cursor:default}
.dd-opt.used:hover{background:transparent}
.dd-check{color:#45C136;font-size:14px}

.add-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.add-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:#FF69FF;cursor:pointer;text-decoration:none;transition:color .15s}
.add-link:hover{color:#CC00CC}
.add-link-plus{width:18px;height:18px;border-radius:50%;background:#FDE8FD;color:#FF69FF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1}
.add-link:hover .add-link-plus{background:#FF69FF;color:#fff}

.sel-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sel-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F7F9FC;border:1px solid #DDE5F0;border-radius:10px}
.sel-info{flex:1;min-width:0}
.sel-brand{font-family:'Nobile',sans-serif;font-size:9px;font-weight:700;color:#28B0D8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.sel-name{font-size:13px;font-weight:500;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose-input{width:78px;padding:7px 9px;font-size:14px;font-weight:500;border:1.5px solid #DDE5F0;border-radius:8px;background:#fff;text-align:right;font-family:'Inter',sans-serif;outline:none}
.dose-input:focus{border-color:#28B0D8;box-shadow:0 0 0 2px rgba(40,176,216,.12)}
.dose-input.filled{background:#E0F6FC;border-color:#A8E8F8}
.dose-unit{font-size:11px;color:#64748B;width:18px}
.sel-rm{width:28px;height:28px;border-radius:7px;background:transparent;border:none;color:#94A3B8;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.sel-rm:hover{background:#FDE8FD;color:#FF69FF}

.mode-wrap{margin-top:18px;padding-top:16px;border-top:1px dashed #DDE5F0}
.mode-lbl{font-size:13px;color:#64748B;font-weight:500;margin-bottom:8px}
.mode-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{padding:8px 14px;border:1.5px solid #DDE5F0;border-radius:100px;background:#fff;color:#64748B;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.pill:hover{border-color:#28B0D8;color:#28B0D8}
.pill.active{background:#E0F6FC;border-color:#A8E8F8;color:#1A7A96;font-weight:600}
.pill-num{width:48px;padding:5px 8px;border:1.5px solid #DDE5F0;border-radius:8px;font-size:13px;text-align:center;outline:none;font-family:'Inter',sans-serif}
.pill-num:focus{border-color:#28B0D8;box-shadow:0 0 0 2px rgba(40,176,216,.12)}
.pill-num.filled{background:#E0F6FC;border-color:#A8E8F8;color:#1A7A96;font-weight:600}

.calc-btn{width:100%;padding:15px;background:linear-gradient(135deg,#28B0D8,#1A8FB2);color:#fff;border:none;border-radius:13px;font-size:16px;font-weight:700;font-family:'Nobile',sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(40,176,216,.4);transition:all .15s}
.calc-btn:hover:not(:disabled){background:linear-gradient(135deg,#1A8FB2,#126E8A);transform:translateY(-1px);box-shadow:0 6px 18px rgba(40,176,216,.5)}
.calc-btn:disabled{background:#DDE5F0;color:#94A3B8;cursor:not-allowed;box-shadow:none}
.calc-hint{font-size:12px;color:#94A3B8;text-align:center;margin-top:8px}

/* === Results card === */
.result-card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(40,176,216,.12);overflow:hidden;animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.r-hdr{padding:18px 20px 14px;border-bottom:1px solid #DDE5F0}
.r-hdr-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.r-title{font-family:'Nobile',sans-serif;font-size:18px;font-weight:700;color:#0F172A;letter-spacing:-.01em}
.r-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;background:#E8FAD8;color:#2E9422;border:1px solid #BFE89A}
.r-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#45C136}
.r-meta{margin-top:6px;font-size:12px;color:#64748B;display:flex;flex-wrap:wrap;gap:4px 10px}
.r-meta span{display:inline-flex;align-items:center;gap:4px}
.r-meta b{color:#0F172A;font-weight:600}

.r-toolbar{padding:12px 20px;background:#F7F9FC;border-bottom:1px solid #DDE5F0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#0F172A;user-select:none}
.toggle-track{width:34px;height:20px;border-radius:100px;background:#CBD5E0;position:relative;transition:background .15s;flex-shrink:0}
.toggle-track.on{background:#28B0D8}
.toggle-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle-track.on .toggle-knob{transform:translateX(14px)}
.toggle-help{color:#94A3B8;cursor:help;font-size:11px}
.r-tools{display:flex;align-items:center;gap:14px}
.tool-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:#28B0D8;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;padding:0;transition:color .15s}
.tool-link:hover{color:#1A8FB2}

.r-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.r-table th{font-size:11px;font-weight:600;color:#64748B;letter-spacing:.02em;padding:10px 16px;text-align:left;border-bottom:1px solid #DDE5F0;background:#fff}
.r-table th.num{text-align:right}
.r-table th.stat{text-align:center;width:96px}
.r-grp-row td{background:#F7F9FC;padding:6px 16px;font-family:'Nobile',sans-serif;font-size:9px;font-weight:700;color:#94A3B8;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #DDE5F0}
.r-row td{padding:11px 16px;font-size:14px;border-bottom:1px solid #F0F4FA}
.r-row:last-child td{border-bottom:none}
.r-row:hover{background:#FAFCFF}
.r-elem{display:flex;align-items:baseline;gap:8px}
.r-sym{font-family:'Nobile',sans-serif;font-weight:700;color:#0F172A;font-size:14px}
.r-sym sub{font-size:10px;font-weight:500}
.r-name{font-size:11px;color:#94A3B8}
.r-val{text-align:right;font-weight:500;color:#0F172A}
.r-val.zero{color:#CBD5E0;font-weight:400}
.r-stat{text-align:center}
.r-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:.02em}
.r-pill.ok{background:#E8FAD8;color:#2E9422}
.r-pill.lo{background:#FFF1DC;color:#B25E00;border:1px solid #FBD7A6}
.r-pill.hi{background:#FDE8E8;color:#C0382B;border:1px solid #F5BFB7}
.r-pill.tr{background:#F0F4FA;color:#94A3B8}
.r-pill::before{content:'';width:5px;height:5px;border-radius:50%}
.r-pill.ok::before{background:#45C136}
.r-pill.lo::before{background:#F0A030}
.r-pill.hi::before{background:#E45447}
.r-pill.tr::before{background:#CBD5E0}

.r-ratios{padding:18px 20px;border-top:1px solid #DDE5F0;background:#FAFCFF}
.r-ratios-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.r-ratios-title{font-family:'Nobile',sans-serif;font-size:11px;font-weight:700;color:#64748B;letter-spacing:.08em;text-transform:uppercase}
.r-ratios-help{font-size:12px;color:#28B0D8;text-decoration:none;transition:color .15s}
.r-ratios-help:hover{color:#1A8FB2;text-decoration:underline}
.r-ratios-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.r-ratios-grid{grid-template-columns:repeat(4,1fr)}}
.ratio{position:relative;border:1.5px solid #DDE5F0;border-radius:10px;padding:14px 12px 10px;background:#fff;transition:border-color .15s}
.ratio.ok{border-color:#BFE89A;background:#FBFFF6}
.ratio.lo,.ratio.hi{border-color:#FBD7A6;background:#FFFCF4}
.ratio-lbl{position:absolute;top:-7px;left:10px;background:#FAFCFF;padding:0 6px;font-family:'Nobile',sans-serif;font-size:10px;font-weight:700;color:#64748B;letter-spacing:.04em}
.ratio.ok .ratio-lbl{color:#2E9422;background:#FBFFF6}
.ratio-val{font-family:'Nobile',sans-serif;font-size:18px;font-weight:700;color:#0F172A;line-height:1.1}
.ratio-val.muted{color:#CBD5E0}
.ratio-target{font-size:10px;color:#94A3B8;margin-top:3px}
.ratio.ok .ratio-target{color:#2E9422}

.r-actions{padding:16px 20px;background:#F7F9FC;border-top:1px solid #DDE5F0;display:flex;flex-direction:column;gap:10px}
.r-cta{width:100%;padding:14px;background:#45C136;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:'Nobile',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 12px rgba(69,193,54,.3);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.r-cta:hover{background:#2E9422;transform:translateY(-1px);box-shadow:0 6px 16px rgba(69,193,54,.4)}
.r-secondary{display:flex;gap:8px}
.r-sec-btn{flex:1;padding:10px;background:#fff;border:1.5px solid #DDE5F0;color:#64748B;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.r-sec-btn:hover{border-color:#28B0D8;color:#28B0D8}

@media(max-width:480px){.nav-pill{display:none} .r-toolbar{flex-direction:column;align-items:flex-start}}

/* === Tweakable: Mood (accent + page wash + CTA) === */
body[data-mood="deep"]{background:#EAF1F9}
body[data-mood="deep"] .nav-logo-icon,body[data-mood="deep"] .badge{background:linear-gradient(135deg,#2A6FDB,#0C447C);box-shadow:0 2px 8px rgba(42,111,219,.4)}
body[data-mood="deep"] .nav-pill{color:#0C447C;background:#D7E5F6;border-color:#A8C7EC}
body[data-mood="deep"] .nav-back:hover,body[data-mood="deep"] .dd-trigger:hover,body[data-mood="deep"] .pill:hover,body[data-mood="deep"] .sel-rm:hover,body[data-mood="deep"] .r-sec-btn:hover,body[data-mood="deep"] .tool-link,body[data-mood="deep"] .r-ratios-help,body[data-mood="deep"] .sel-brand{color:#2A6FDB}
body[data-mood="deep"] .nav-logo span span:nth-child(2){color:#2A6FDB}
body[data-mood="deep"] .finput:focus,body[data-mood="deep"] .dose-input:focus,body[data-mood="deep"] .pill-num:focus,body[data-mood="deep"] .dd-trigger.open{border-color:#2A6FDB!important;box-shadow:0 0 0 3px rgba(42,111,219,.14)!important}
body[data-mood="deep"] .finput.filled,body[data-mood="deep"] .dose-input.filled,body[data-mood="deep"] .pill-num.filled,body[data-mood="deep"] .pill.active{background:#D7E5F6!important;border-color:#A8C7EC!important;color:#0C447C!important}
body[data-mood="deep"] .calc-btn{background:linear-gradient(135deg,#2A6FDB,#0C447C);box-shadow:0 4px 14px rgba(42,111,219,.4)}
body[data-mood="deep"] .toggle-track.on{background:#2A6FDB}
body[data-mood="deep"] .r-hdr{background:linear-gradient(180deg,#F1F6FC 0%,#fff 100%)}

body[data-mood="botanical"]{background:#F4F8EE}
body[data-mood="botanical"] .nav-logo-icon,body[data-mood="botanical"] .badge{background:linear-gradient(135deg,#5BA84B,#2E7D34);box-shadow:0 2px 8px rgba(91,168,75,.4)}
body[data-mood="botanical"] .nav-pill{color:#2E7D34;background:#DCEFD0;border-color:#B7DCA0}
body[data-mood="botanical"] .nav-back:hover,body[data-mood="botanical"] .dd-trigger:hover,body[data-mood="botanical"] .pill:hover,body[data-mood="botanical"] .sel-rm:hover,body[data-mood="botanical"] .r-sec-btn:hover,body[data-mood="botanical"] .tool-link,body[data-mood="botanical"] .r-ratios-help,body[data-mood="botanical"] .sel-brand{color:#5BA84B}
body[data-mood="botanical"] .nav-logo span span:nth-child(2){color:#5BA84B}
body[data-mood="botanical"] .finput:focus,body[data-mood="botanical"] .dose-input:focus,body[data-mood="botanical"] .pill-num:focus,body[data-mood="botanical"] .dd-trigger.open{border-color:#5BA84B!important;box-shadow:0 0 0 3px rgba(91,168,75,.18)!important}
body[data-mood="botanical"] .finput.filled,body[data-mood="botanical"] .dose-input.filled,body[data-mood="botanical"] .pill-num.filled,body[data-mood="botanical"] .pill.active{background:#DCEFD0!important;border-color:#B7DCA0!important;color:#2E7D34!important}
body[data-mood="botanical"] .calc-btn{background:linear-gradient(135deg,#5BA84B,#2E7D34);box-shadow:0 4px 14px rgba(91,168,75,.4)}
body[data-mood="botanical"] .toggle-track.on{background:#5BA84B}
body[data-mood="botanical"] .r-cta{background:#0F172A;box-shadow:0 4px 12px rgba(15,23,42,.25)}
body[data-mood="botanical"] .r-cta:hover{background:#000}
body[data-mood="botanical"] .r-hdr{background:linear-gradient(180deg,#F4F8EE 0%,#fff 100%)}

body[data-mood="lab"]{background:#FAFAF7}
body[data-mood="lab"] .nav-logo-icon,body[data-mood="lab"] .badge{background:#0F172A;box-shadow:none}
body[data-mood="lab"] .nav-pill{color:#0F172A;background:#fff;border-color:#0F172A}
body[data-mood="lab"] .nav-back:hover,body[data-mood="lab"] .dd-trigger:hover,body[data-mood="lab"] .pill:hover,body[data-mood="lab"] .sel-rm:hover,body[data-mood="lab"] .r-sec-btn:hover,body[data-mood="lab"] .tool-link,body[data-mood="lab"] .r-ratios-help,body[data-mood="lab"] .sel-brand{color:#C0382B}
body[data-mood="lab"] .nav-logo span span:nth-child(2){color:#C0382B}
body[data-mood="lab"] .finput:focus,body[data-mood="lab"] .dose-input:focus,body[data-mood="lab"] .pill-num:focus,body[data-mood="lab"] .dd-trigger.open{border-color:#0F172A!important;box-shadow:0 0 0 2px rgba(15,23,42,.12)!important}
body[data-mood="lab"] .finput.filled,body[data-mood="lab"] .dose-input.filled,body[data-mood="lab"] .pill-num.filled,body[data-mood="lab"] .pill.active{background:#FFF6F4!important;border-color:#C0382B!important;color:#C0382B!important}
body[data-mood="lab"] .calc-btn{background:#0F172A;box-shadow:none;border-radius:4px;font-family:'Nobile',sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
body[data-mood="lab"] .calc-btn:hover:not(:disabled){background:#000;transform:none;box-shadow:none}
body[data-mood="lab"] .toggle-track.on{background:#0F172A}
body[data-mood="lab"] .r-cta{background:#C0382B;border-radius:4px;letter-spacing:.1em;box-shadow:none}
body[data-mood="lab"] .r-cta:hover{background:#9A2A20;transform:none;box-shadow:none}
body[data-mood="lab"] .r-hdr{background:#fff;border-bottom:2px solid #0F172A}
body[data-mood="lab"] .r-title{font-family:'Nobile',serif;font-style:italic}

/* === Tweakable: Density === */
body[data-density="compact"] .page{padding:14px 14px 48px;gap:10px}
body[data-density="compact"] .card-hdr{padding:10px 14px}
body[data-density="compact"] .card-body{padding:14px}
body[data-density="compact"] .finput{padding:9px 12px;font-size:14px}
body[data-density="compact"] .calc-btn{padding:12px;font-size:14px}

<body>

<nav>
  <div class="nav-inner">
    <a href="Landing Page.html" class="nav-logo">
      <div class="nav-logo-icon"><svg width="13" height="13" viewBox="0 0 15 15" fill="none"><path d="M3 12V5.5l4.5-4L12 5.5V12M5.5 12V9h4v3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span style="color:#0F172A">Aqua<span style="color:#28B0D8">Calc</span></span>
    </a>
    <span class="nav-pill">Доступ активен</span>
    <a href="Landing Page.html" class="nav-back">← На главную</a>
  </div>

<div id="root"></div>

<script type="text/babel">

// ratios used to derive trace / hardness elements from primary fert content
// (Na from NO3 by NaNO3 stoichiometry, trace from Fe via typical micro-mix proportions)
const FERT_DB = {
  'Aquayer': [
  { id: 'aq-m', name: 'Macro', no3: 52, po4: 8.7, k: 24, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'aq-mi', name: 'Micro', no3: 0, po4: 0, k: 0, fe: 4, mn: 0.5, mg: 0, ca: 0, so4: 0, trace: true },
  { id: 'aq-k', name: 'Калий', no3: 0, po4: 0, k: 60, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 },
  { id: 'aq-fe', name: 'Железо', no3: 0, po4: 0, k: 0, fe: 6, mn: 0, mg: 0, ca: 0, so4: 0, trace: true },
  { id: 'aq-no3', name: 'Нитрат', no3: 80, po4: 0, k: 0, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'aq-gh', name: 'GH+', no3: 0, po4: 0, k: 0, fe: 0, mn: 0, mg: 8, ca: 16, so4: 5 }],

  'Dennerle': [
  { id: 'd-pro', name: 'Plant Care Pro', no3: 4, po4: 0.8, k: 12, fe: 0.5, mn: 0.1, mg: 2, ca: 0, so4: 3, trace: true },
  { id: 'd-n', name: 'Plant Care N', no3: 40, po4: 0, k: 0, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'd-p', name: 'Plant Care P', no3: 0, po4: 20, k: 0, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 },
  { id: 'd-k', name: 'Plant Care K', no3: 0, po4: 0, k: 87, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 }],

  'Tropica': [
  { id: 'tr-c', name: 'Premium Complete', no3: 13, po4: 4.5, k: 11, fe: 0.07, mn: 0.05, mg: 0, ca: 0, so4: 0, trace: true },
  { id: 'tr-s', name: 'Specialised', no3: 43, po4: 15, k: 35, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true }],

  'Sera': [
  { id: 'se-m', name: 'Florena Macro', no3: 40, po4: 6, k: 20, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'se-mi', name: 'Florena Micro', no3: 0, po4: 0, k: 0, fe: 3, mn: 0.2, mg: 0, ca: 0, so4: 0, trace: true }],

  'JBL': [
  { id: 'jbl-m', name: 'ProScape Macro', no3: 35, po4: 9, k: 18, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'jbl-fe', name: 'ProScape Fe Micro', no3: 0, po4: 0, k: 0, fe: 5, mn: 0.3, mg: 0, ca: 0, so4: 0, trace: true },
  { id: 'jbl-k', name: 'ProScape K Macro', no3: 0, po4: 0, k: 65, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 }],

  'Seachem': [
  { id: 'sc-f', name: 'Flourish', no3: 0, po4: 0, k: 0, fe: 0.05, mn: 0.02, mg: 0, ca: 0, so4: 0, trace: true },
  { id: 'sc-n', name: 'Flourish Nitrogen', no3: 15, po4: 0, k: 1, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0, naFromNo3: true },
  { id: 'sc-p', name: 'Flourish Phosphorus', no3: 0, po4: 30, k: 0, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 },
  { id: 'sc-k', name: 'Flourish Potassium', no3: 0, po4: 0, k: 50, fe: 0, mn: 0, mg: 0, ca: 0, so4: 0 },
  { id: 'sc-fe', name: 'Flourish Iron', no3: 0, po4: 0, k: 0, fe: 10, mn: 0, mg: 0, ca: 0, so4: 0, trace: true }]

};
// trace ratios relative to Fe in a typical aquarium micro mix
const TRACE = { b: 0.054, zn: 0.040, mo: 0.013, cu: 0.013, co: 0.0036, ni: 0.00071, v: 0.00029 };

const ELEMENTS = [
{ key: 'no3', sym: 'NO', sub: '3', name: 'Нитрат', group: 'macro', target: [5, 30], hardness: false },
{ key: 'po4', sym: 'PO', sub: '4', name: 'Фосфат', group: 'macro', target: [0.5, 3], hardness: false },
{ key: 'k', sym: 'K', sub: '', name: 'Калий', group: 'macro', target: [5, 30], hardness: false },
{ key: 'mg', sym: 'Mg', sub: '', name: 'Магний', group: 'macro', target: [2, 10], hardness: true },
{ key: 'ca', sym: 'Ca', sub: '', name: 'Кальций', group: 'macro', target: [10, 30], hardness: true },
{ key: 'so4', sym: 'SO', sub: '4', name: 'Сульфат', group: 'macro', target: [0.5, 30], hardness: false },
{ key: 'na', sym: 'Na', sub: '', name: 'Натрий', group: 'macro', target: null, hardness: false },
{ key: 'fe', sym: 'Fe', sub: '', name: 'Железо', group: 'micro', target: [0.05, 0.5], hardness: false },
{ key: 'mn', sym: 'Mn', sub: '', name: 'Марганец', group: 'micro', target: [0.02, 0.2], hardness: false },
{ key: 'b', sym: 'B', sub: '', name: 'Бор', group: 'micro', target: null, hardness: false },
{ key: 'zn', sym: 'Zn', sub: '', name: 'Цинк', group: 'micro', target: null, hardness: false },
{ key: 'mo', sym: 'Mo', sub: '', name: 'Молибден', group: 'micro', target: null, hardness: false },
{ key: 'cu', sym: 'Cu', sub: '', name: 'Медь', group: 'micro', target: null, hardness: false },
{ key: 'co', sym: 'Co', sub: '', name: 'Кобальт', group: 'micro', target: null, hardness: false },
{ key: 'ni', sym: 'Ni', sub: '', name: 'Никель', group: 'micro', target: null, hardness: false },
{ key: 'v', sym: 'V', sub: '', name: 'Ванадий', group: 'micro', target: null, hardness: false }];


const RATIOS = [
{ id: 'no3-po4', a: 'no3', b: 'po4', label: 'NO₃ / PO₄', target: [10, 15] },
{ id: 'no3-k', a: 'no3', b: 'k', label: 'NO₃ / K', target: [0.7, 1.5] },
{ id: 'fe-mn', a: 'fe', b: 'mn', label: 'Fe / Mn', target: [2, 4] },
{ id: 'ca-mg', a: 'ca', b: 'mg', label: 'Ca / Mg', target: [3, 4] }];


function getAllFerts() {
  const all = {};
  Object.entries(FERT_DB).forEach(([brand, items]) => items.forEach((f) => all[f.id] = { ...f, brand }));
  return all;
}
function fmt(n) {
  if (n === 0 || n == null) return '—';
  if (n < 0.0001) return n.toExponential(1);
  if (n < 0.001) return n.toFixed(5);
  if (n < 0.01) return n.toFixed(4);
  if (n < 0.1) return n.toFixed(3);
  if (n < 10) return n.toFixed(2);
  return n.toFixed(1);
}
function rangeStatus(val, target) {
  if (!target) return 'tr';
  if (val < target[0] * 0.5) return 'lo';
  if (val < target[0]) return 'lo';
  if (val > target[1]) return 'hi';
  return 'ok';
}
function pillLabel(s) {return { ok: 'оптим.', lo: 'низко', hi: 'высоко', tr: 'трасс.' }[s];}

function Toggle({ on, onChange, label, hint }) {
  return (
    <label className="toggle">
      <span className={`toggle-track ${on ? 'on' : ''}`} onClick={() => onChange(!on)}>
        <span className="toggle-knob"></span>
      </span>
      <span>{label}</span>
      {hint && <span className="toggle-help" title={hint}>ⓘ</span>}
    </label>);

}

function App() {
  const [vol, setVol] = React.useState('80');
  const [cvol, setCvol] = React.useState('20');
  const [period, setPeriod] = React.useState('7');
  const [ddOpen, setDdOpen] = React.useState(false);
  const [entries, setEntries] = React.useState([]);
  const [mode, setMode] = React.useState('change');
  const [customN, setCustomN] = React.useState('');
  const [results, setResults] = React.useState(null);
  const [showHard, setShowHard] = React.useState(false);
  const ddRef = React.useRef(null);

  const fertMap = getAllFerts();

  React.useEffect(() => {
    const onClick = (e) => {if (ddRef.current && !ddRef.current.contains(e.target)) setDdOpen(false);};
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, []);

  const pickFert = (id) => {
    if (entries.find((e) => e.id === id)) return;
    const f = fertMap[id];
    setEntries((prev) => [...prev, { id, name: f.name, brand: f.brand, dose: '' }]);
    setDdOpen(false);
    setResults(null);
  };
  const updateDose = (id, val) => {
    setEntries((prev) => prev.map((e) => e.id === id ? { ...e, dose: val } : e));
    setResults(null);
  };
  const removeFert = (id) => {
    setEntries((prev) => prev.filter((e) => e.id !== id));
    setResults(null);
  };

  const v = parseFloat(vol);
  const cv = parseFloat(cvol);
  const p = parseInt(period);
  const customOk = mode !== 'custom' || parseInt(customN) > 0;
  const fertOk = entries.length > 0 && entries.every((e) => parseFloat(e.dose) > 0);
  const canCalc = v > 0 && cv > 0 && p > 0 && customOk && fertOk;

  let hint = '';
  if (!canCalc) {
    if (!v) hint = 'Укажите объём аквариума';else
    if (!cv) hint = 'Укажите объём подменной воды';else
    if (!p) hint = 'Укажите частоту подмены';else
    if (mode === 'custom' && !customOk) hint = 'Укажите периодичность внесения';else
    if (!entries.length) hint = 'Добавьте хотя бы одно удобрение';else
    if (!fertOk) hint = 'Введите дозу для всех удобрений';
  }

  const calculate = () => {
    // applications per period (period = подмена раз в N дней; общая доза = за этот период)
    const appsPerPeriod = mode === 'daily' ? p : mode === 'change' ? 1 : Math.floor(p / parseInt(customN));
    const totals = {};ELEMENTS.forEach((el) => totals[el.key] = 0);
    entries.forEach((e) => {
      const dml = parseFloat(e.dose) || 0; // ml per single application
      const f = fertMap[e.id];
      // primary: mg per liter from one app
      ['no3', 'po4', 'k', 'fe', 'mn', 'mg', 'ca', 'so4'].forEach((k) => {
        if (f[k] > 0) totals[k] += f[k] * dml / v;
      });
      // derive Na from NO3 (NaNO3) — mass ratio Na/NO3 = 22.99 / 62.00 = 0.371
      if (f.naFromNo3 && f.no3 > 0) totals.na += f.no3 * 0.371 * dml / v;
      // derive trace from Fe
      if (f.trace && f.fe > 0) {
        Object.entries(TRACE).forEach(([tk, ratio]) => {totals[tk] += f.fe * ratio * dml / v;});
      }
    });
    // totals are PER APPLICATION concentration. per-period = * appsPerPeriod, per-day = / period
    const perApp = { ...totals };
    const perDay = {},perPeriod = {};
    ELEMENTS.forEach((el) => {
      perPeriod[el.key] = perApp[el.key] * appsPerPeriod;
      perDay[el.key] = perPeriod[el.key] / p;
    });
    setResults({ perDay, perPeriod, appsPerPeriod });
    setTimeout(() => {
      const r = document.getElementById('result-card');
      if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
  };

  const reset = () => {
    setVol('');setCvol('');setPeriod('');setEntries([]);
    setMode('change');setCustomN('');setResults(null);
  };

  const usedIds = entries.map((e) => e.id);
  const modeLabel = mode === 'daily' ? 'каждый день' : mode === 'change' ? 'вместе с подменой' : `раз в ${customN} дн.`;

  // overall status
  let overall = 'ok';
  if (results) {
    const flagged = ELEMENTS.filter((el) => el.target && (el.hardness ? showHard : true)).
    map((el) => rangeStatus(results.perPeriod[el.key], el.target));
    if (flagged.includes('hi')) overall = 'hi';else
    if (flagged.includes('lo')) overall = 'lo';
  }
  const overallLabel = { ok: 'Состав сбалансирован', lo: 'Есть дефицит', hi: 'Превышение нормы' }[overall];
  const overallClass = { ok: 'ok', lo: 'lo', hi: 'hi' }[overall];

  // visible elements
  const visibleEls = ELEMENTS.filter((el) => showHard || !el.hardness);
  const macroEls = visibleEls.filter((el) => el.group === 'macro');
  const microEls = visibleEls.filter((el) => el.group === 'micro');

  // ratios
  const ratioVals = results ? RATIOS.map((r) => {
    const a = results.perPeriod[r.a],b = results.perPeriod[r.b];
    const val = a > 0 && b > 0 ? a / b : null;
    const status = val == null ? 'tr' : rangeStatus(val, r.target);
    return { ...r, val, status };
  }) : [];

  return (
    <div className="page">

      <div className="card">
        <div className="card-hdr"><div className="badge">1</div><div className="sec-title">Объём аквариума</div></div>
        <div className="card-body">
          <div className="field">
            <div className="flbl">Полный объём аквариума</div>
            <input className={`finput ${vol ? 'filled' : ''}`} type="number" placeholder="80" value={vol} onChange={(e) => setVol(e.target.value)} />
            <div className="funit">литров</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-hdr"><div className="badge">2</div><div className="sec-title">Подмена воды</div></div>
        <div className="card-body">
          <div className="row2">
            <div className="field">
              <div className="flbl">Объём подмены</div>
              <input className={`finput ${cvol ? 'filled' : ''}`} type="number" placeholder="20" value={cvol} onChange={(e) => setCvol(e.target.value)} />
              <div className="funit">литров</div>
            </div>
            <div className="field">
              <div className="flbl">Подмена воды раз в</div>
              <input className={`finput ${period ? 'filled' : ''}`} type="number" placeholder="7" value={period} onChange={(e) => setPeriod(e.target.value)} />
              <div className="funit">дней</div>
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-hdr"><div className="badge">3</div><div className="sec-title">Удобрения</div></div>
        <div className="card-body">
          <div className="dd-wrap" ref={ddRef}>
            <div className={`dd-trigger ${ddOpen ? 'open' : ''}`} onClick={() => setDdOpen(!ddOpen)}>
              <span>{entries.length ? `Выбрано: ${entries.length}` : 'Выберите удобрение из списка'}</span>
              <svg className="dd-chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5l3.5 3.5L10.5 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
            </div>
            {ddOpen &&
            <div className="dd-panel">
                {Object.entries(FERT_DB).map(([brand, items]) =>
              <div key={brand}>
                    <div className="dd-group-label">{brand}</div>
                    {items.map((f) => {
                  const used = usedIds.includes(f.id);
                  return (
                    <div key={f.id} className={`dd-opt ${used ? 'used' : ''}`} onClick={() => !used && pickFert(f.id)}>
                          <span>{f.name}</span>{used && <span className="dd-check">✓</span>}
                        </div>);

                })}
                  </div>
              )}
              </div>
            }
          </div>

          <div className="add-row">
            <a className="add-link" onClick={(e) => {e.preventDefault();alert('Форма добавления удобрения вручную');}} style={{ color: "rgb(0, 204, 179)" }}>
              <span className="add-link-plus" style={{ color: "rgb(4, 203, 180)" }}>+</span>Добавить новое удобрение
            </a>
          </div>

          {entries.length > 0 &&
          <div className="sel-list">
              {entries.map((e) =>
            <div className="sel-row" key={e.id}>
                  <div className="sel-info">
                    <div className="sel-brand">{e.brand}</div>
                    <div className="sel-name">{e.name}</div>
                  </div>
                  <input className={`dose-input ${e.dose ? 'filled' : ''}`} type="number" placeholder="0" value={e.dose} onChange={(ev) => updateDose(e.id, ev.target.value)} />
                  <span className="dose-unit">мл</span>
                  <button className="sel-rm" onClick={() => removeFert(e.id)} title="Убрать">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" /></svg>
                  </button>
                </div>
            )}
            </div>
          }

          {entries.length > 0 &&
          <div className="mode-wrap">
              <div className="mode-lbl">Режим внесения удобрений</div>
              <div className="mode-pills">
                <button className={`pill ${mode === 'change' ? 'active' : ''}`} onClick={() => setMode('change')}>В подменную</button>
                <button className={`pill ${mode === 'daily' ? 'active' : ''}`} onClick={() => setMode('daily')}>Каждый день</button>
                <button className={`pill ${mode === 'custom' ? 'active' : ''}`} onClick={() => setMode('custom')}>
                  Раз в
                  <input className={`pill-num ${customN ? 'filled' : ''}`} type="number" placeholder="N" value={customN} onClick={(e) => e.stopPropagation()} onChange={(e) => {setCustomN(e.target.value);setMode('custom');}} />
                  дн.
                </button>
              </div>
            </div>
          }
        </div>
      </div>

      <div>
        <button className="calc-btn" disabled={!canCalc} onClick={calculate}>Рассчитать</button>
        {hint && <div className="calc-hint">{hint}</div>}
      </div>

      {results &&
      <div id="result-card" className="result-card">
          {/* Header — visibility of system status: shows context + overall verdict */}
          <div className="r-hdr">
            <div className="r-hdr-top">
              <div className="r-title">Концентрации элементов в аквариуме</div>
              <span className={`r-status ${overallClass !== 'ok' ? 'r-status-' + overallClass : ''}`} style={overallClass === 'hi' ? { background: '#FDE8E8', color: '#C0382B', borderColor: '#F5BFB7' } : overallClass === 'lo' ? { background: '#FFF1DC', color: '#B25E00', borderColor: '#FBD7A6' } : null}>{overallLabel}</span>
            </div>
            <div className="r-meta">
              <span>Аквариум <b>{v} л</b></span><span>·</span>
              <span>Подмена <b>{cv} л</b> раз в <b>{p} дн.</b></span><span>·</span>
              <span>Внесение: <b>{modeLabel}</b></span>
            </div>
          </div>

          {/* Toolbar — flexibility & user control */}
          <div className="r-toolbar">
            <Toggle on={showHard} onChange={setShowHard} label="Показать повышение жёсткости" hint="Учитывает Ca и Mg в общей жёсткости (GH) воды" />
            <div className="r-tools">
              <button className="tool-link" title="График накопления элементов между подменами">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 12l4-4 3 3 5-6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /><path d="M11 5h2v2" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
                Накопление
              </button>
              <button className="tool-link" title="Сравнить с целевыми значениями">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h7M7 5l3 3-3 3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /><path d="M13 4v8" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" /></svg>
                Сравнение
              </button>
            </div>
          </div>

          {/* Table — grouped, sorted, with status pills (recognition + error prevention) */}
          <table className="r-table">
            <thead>
              <tr>
                <th>Элемент</th>
                <th className="num">В день, мг/л</th>
                <th className="num">Общая доза, мг/л</th>
                <th className="stat">Статус</th>
              </tr>
            </thead>
            <tbody>
              <tr className="r-grp-row"><td colSpan="4">Макроэлементы</td></tr>
              {macroEls.sort((a, b) => results.perPeriod[b.key] - results.perPeriod[a.key]).map((el) => {
              const day = results.perDay[el.key],tot = results.perPeriod[el.key];
              const isZero = tot < 0.0000005;
              const status = el.target ? rangeStatus(tot, el.target) : isZero ? 'tr' : 'tr';
              return (
                <tr key={el.key} className="r-row">
                    <td>
                      <span className="r-elem">
                        <span className="r-sym">{el.sym}{el.sub && <sub>{el.sub}</sub>}</span>
                        <span className="r-name">{el.name}</span>
                      </span>
                    </td>
                    <td className={`r-val ${isZero ? 'zero' : ''}`}>{fmt(day)}</td>
                    <td className={`r-val ${isZero ? 'zero' : ''}`}>{fmt(tot)}</td>
                    <td className="r-stat">{!isZero && el.target && <span className={`r-pill ${status}`}>{pillLabel(status)}</span>}{isZero && <span style={{ color: '#CBD5E0', fontSize: 11 }}>—</span>}{!isZero && !el.target && <span className="r-pill tr">след.</span>}</td>
                  </tr>);

            })}
              <tr className="r-grp-row"><td colSpan="4">Микроэлементы</td></tr>
              {microEls.sort((a, b) => results.perPeriod[b.key] - results.perPeriod[a.key]).map((el) => {
              const day = results.perDay[el.key],tot = results.perPeriod[el.key];
              const isZero = tot < 0.0000005;
              const status = el.target ? rangeStatus(tot, el.target) : 'tr';
              return (
                <tr key={el.key} className="r-row">
                    <td>
                      <span className="r-elem">
                        <span className="r-sym">{el.sym}</span>
                        <span className="r-name">{el.name}</span>
                      </span>
                    </td>
                    <td className={`r-val ${isZero ? 'zero' : ''}`}>{fmt(day)}</td>
                    <td className={`r-val ${isZero ? 'zero' : ''}`}>{fmt(tot)}</td>
                    <td className="r-stat">{!isZero && el.target && <span className={`r-pill ${status}`}>{pillLabel(status)}</span>}{isZero && <span style={{ color: '#CBD5E0', fontSize: 11 }}>—</span>}{!isZero && !el.target && <span className="r-pill tr">след.</span>}</td>
                  </tr>);

            })}
            </tbody>
          </table>

          {/* Ratios — recognition over recall: target ranges shown */}
          <div className="r-ratios">
            <div className="r-ratios-hdr">
              <div className="r-ratios-title">Соотношения</div>
              <a className="r-ratios-help" href="#" onClick={(e) => {e.preventDefault();alert('Откроется справка: какие соотношения важны и почему');}}>Нет нужного соотношения?</a>
            </div>
            <div className="r-ratios-grid">
              {ratioVals.map((r) =>
            <div key={r.id} className={`ratio ${r.status}`}>
                  <div className="ratio-lbl">{r.label}</div>
                  <div className={`ratio-val ${r.val == null ? 'muted' : ''}`}>{r.val == null ? '—' : r.val.toFixed(2)}</div>
                  <div className="ratio-target">цель {r.target[0]}–{r.target[1]}</div>
                </div>
            )}
            </div>
          </div>

          {/* Actions — user control: clear primary action + recoverable secondary */}
          <div className="r-actions">
            <button className="r-cta" onClick={() => alert('Открывается экран расписания подачи удобрений')}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5" stroke="#fff" strokeWidth="1.4" /><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3" stroke="#fff" strokeWidth="1.4" strokeLinecap="round" /></svg>
              Составить расписание
            </button>
            <div className="r-secondary">
              <button className="r-sec-btn" onClick={() => {document.querySelector('.page').scrollIntoView({ behavior: 'smooth' });}}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3.5L5.5 7L9 10.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                Изменить параметры
              </button>
              <button className="r-sec-btn" onClick={reset}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 7a4 4 0 11-1.2-2.83M11 3v2.5h-2.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                Сбросить
              </button>
            </div>
          </div>
        </div>
      }

    </div>);

}

// Tweaks defaults — block parsed by host on save
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "mood": "aqua",
  "density": "regular",
  "surface": "soft"
} /*EDITMODE-END*/;

function Calc() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => {
    document.body.dataset.mood = t.mood;
    document.body.dataset.density = t.density;
    document.body.dataset.surface = t.surface;
  }, [t.mood, t.density, t.surface]);
  return (
    <React.Fragment>
      <App />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Mood" />
        <TweakSelect label="Палитра" value={t.mood}
        options={[
        { value: 'aqua', label: 'Aqua — лёгкая, морская' },
        { value: 'deep', label: 'Deep Sea — серьёзная, глубокая' },
        { value: 'botanical', label: 'Botanical — растительная' },
        { value: 'lab', label: 'Lab — научная, монохром' }]
        }
        onChange={(v) => setTweak('mood', v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Плотность" value={t.density}
        options={[
        { value: 'compact', label: 'Компакт' },
        { value: 'regular', label: 'Обычная' },
        { value: 'spacious', label: 'Просторно' }]
        }
        onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Поверхности" value={t.surface}
        options={[
        { value: 'soft', label: 'Карточки' },
        { value: 'flat', label: 'Плоско' },
        { value: 'glass', label: 'Стекло' }]
        }
        onChange={(v) => setTweak('surface', v)} />
      </TweaksPanel>
    </React.Fragment>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<Calc />);
</script>
</body>
</html>
